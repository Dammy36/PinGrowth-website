<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinGrowth Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header
      class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-white/10"
    >
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"
      >
        <a href="#" class="text-lg font-extrabold tracking-wide">
          <span class="text-white">PinGrowth</span
          ><span class="text-pink-400">Digital</span>
        </a>

        <nav
          class="hidden gap-6 text-xs font-semibold tracking-[0.25em] text-gray-200 md:flex"
        >
          <a href="#about" class="hover:text-pink-300">ABOUT</a>
          <a href="#services" class="hover:text-pink-300">SERVICES</a>
          <a href="#pricing" class="hover:text-pink-300">PRICING</a>
          <a href="#testimonial" class="hover:text-pink-300">TESTIMONIAL</a>
          <a href="#contact" class="hover:text-pink-300">CONTACT</a>
        </nav>

        <a
          href="#contact"
          class="rounded-full bg-pink-500 px-4 py-2 text-sm font-bold hover:bg-pink-600 pop"
        >
          GET STARTED
        </a>
      </div>
    </header>
    <script src="App.js"></script>
  </body>
</html>
